name: smartPOSCloud CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 22

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 10

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check code formatting
      run: pnpm exec prettier --check "src/**/*.ts" "test/**/*.ts"

    - name: Lint code
      run: pnpm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Run tests
      run: pnpm run test

    - name: Build project
      run: pnpm run build
